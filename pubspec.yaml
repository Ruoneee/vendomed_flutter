name: vendomed_flutter
description: "VendoMed app using Flutter."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.33.5
  usb_serial: ^0.5.2
  sqflite: ^2.0.0+3
  path: ^1.8.0
  cupertino_icons: ^1.0.8
  syncfusion_flutter_charts: ^28.2.9
  pdf: ^3.9.0
  printing: ^5.9.0
  intl: ^0.20.2
  http: ^0.13.6
  url_launcher: ^6.1.7
  qr_flutter: ^4.0.0
  shared_preferences: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets: # for adding images (need to declare it here)
    - assets/images/splash_logo.png
    - assets/images/tap_rfid.png
    - assets/images/ibuprofen.png
    - assets/images/paracetamol.png
    - assets/images/loperamide.png
    - assets/images/cetirizine.png
    - assets/images/buscopan.png
    - assets/images/antacid.png
    - assets/userIcons/user_icon.png
    - assets/images/cashcoins.png
    - assets/images/gcashlogo.png
    - assets/images/qrcode.png
    - assets/vendomed.db
    - assets/images/points.png
  uses-material-design: true
